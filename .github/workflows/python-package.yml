# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: build

on:
  push:
  pull_request:
    branches:
      - master
  schedule:
    - cron: '42 0 * * *'

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'
    - name: Install
      run: pip install tox
    - name: Script
      run: tox -e py
    - name: After Success
      # Every matrix job runs the same tests against the same source, so one
      # report per commit is enough for Codecov.
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v7
      with:
        # Must be set in both the Actions and Dependabot secret stores: runs
        # triggered by Dependabot can only read Dependabot secrets.
        token: ${{ secrets.CODECOV_TOKEN }}
        # Do not mask upload failures: a failed upload leaves codecov/patch and
        # codecov/project pending, which silently blocks merging.
        fail_ci_if_error: true
        verbose: true

  frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: sqllineagejs/package-lock.json
    - name: Install dependencies
      working-directory: sqllineagejs
      run: npm ci
    - name: Lint
      working-directory: sqllineagejs
      run: npm run lint
    - name: Check formatting
      working-directory: sqllineagejs
      run: npm run format:check
    - name: Build
      working-directory: sqllineagejs
      run: npm run build
