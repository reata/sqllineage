repos:
  - repo: https://github.com/psf/black
    rev: 26.1.0
    hooks:
      - id: black
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.3
    hooks:
      - id: ruff
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.0
    hooks:
    - id: mypy
      additional_dependencies:
        - sqlfluff
  - repo: local
    hooks:
      - id: js-check
        name: js check (eslint + prettier)
        entry: bash -c 'if command -v npm >/dev/null 2>&1; then cd sqllineagejs && npm run check; else echo "npm not found; skipping js check (CI enforces it)"; fi'
        language: system
        files: ^sqllineagejs/
        pass_filenames: false
